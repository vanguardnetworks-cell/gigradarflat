<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>GigRadar v3</title>
<style>
:root{--bg:#050907;--card:#0a110e;--line:#1c2e24;--tx:#edf5f0;--mut:#7f9088;--g:#59e391;--y:#e0b050;--r:#f0625f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:auto;min-height:100vh;padding:18px 18px calc(90px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% -10%,#10241a,#050907 45%)}
h1{font-size:30px;line-height:1.05;margin:6px 0 4px}h2{font-size:16px;margin:22px 0 8px}p{color:var(--mut);margin:0 0 10px;font-size:13px}
.good{color:var(--g)}.part{color:var(--y)}.bad{color:var(--r)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;display:block}
.card.top{border-color:#326d4b}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px;background:#103a23;color:var(--g);white-space:nowrap}.pill.part{background:#2d2111;color:var(--y)}.pill.bad{background:#3d1a1e;color:var(--r)}
.m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.m b{display:block;font-size:14px}.m small{color:var(--mut);font-size:10px}
.big{font-size:34px;font-weight:800}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--g);color:#06100a;font:700 15px inherit;font-family:inherit;margin-top:10px;cursor:pointer}.btn.alt{background:#16211b;color:var(--tx)}
.two{display:flex;gap:8px}
label{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #203029;background:var(--card);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
.rule{display:grid;grid-template-columns:1fr 96px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.rule span{font-size:13px}.rule label{margin:0;display:flex;gap:5px;align-items:center;font-size:11px}
.chip{display:inline-flex;gap:6px;align-items:center;background:#101a15;border:1px solid #26372e;border-radius:99px;padding:5px 10px;margin:0 6px 6px 0;font-size:12px}.chip button{background:none;border:0;color:var(--mut);font-size:15px}
.chk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.chk i{font-style:normal;font-weight:800;width:20px}.chk small{display:block;color:var(--mut)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:#050907f5;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:#65746c;font:600 12px inherit;font-family:inherit}nav .on{color:var(--g)}
.back{background:none;border:0;color:var(--mut);padding:0 0 10px;font-size:14px}
.hero{text-align:center;padding:70px 0 20px}.hero h1{font-size:38px}
.map{position:relative;height:460px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background-color:#09130f;background-image:linear-gradient(#102019 1px,transparent 1px),linear-gradient(90deg,#102019 1px,transparent 1px);background-size:38px 38px;margin-top:10px}
.road{position:absolute;height:7px;background:#172b22;width:130%}.r1{top:45%;left:-15%;transform:rotate(-20deg)}.r2{top:58%;left:-10%;transform:rotate(28deg)}
.zone{position:absolute;border:1px dashed #3a4a42;background:#ffffff08;border-radius:45%;padding:24px 22px;color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.zone.pref{border-color:#3e825a;background:#2f814f22;color:#5ccf88}.zone.avoid{border-color:#a14444;background:#f0625f18;color:var(--r)}
.pin{position:absolute;width:40px;height:40px;border-radius:50%;border:1px solid #35453c;background:#101914;color:#bdc9c2;font:800 11px inherit;font-family:inherit;padding:0}
.pin.good{background:#113b24;color:#69e39a;border-color:#4aa873}.pin.part{border-color:var(--y);color:var(--y)}.pin.bad{border-color:#a14444;color:var(--r)}
#splash{position:fixed;inset:0;z-index:99;background:#050907;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}#splash h1{font-size:34px;margin:8px 0 4px}#splash p{color:var(--g);font-weight:700;font-size:16px}
@media(prefers-reduced-motion:reduce){#splash{transition:none}}
</style></head><body><div id="app"></div>
<script>
const SAMPLE=[
{id:1,app:"DoorDash",pay:24.5,mi:6.2,min:31,rest:"Riverside Grill",zone:"Downtown"},
{id:2,app:"Uber Eats",pay:21.75,mi:7.1,min:28,rest:"Taco Lane",zone:"Midtown"},
{id:3,app:"Grubhub",pay:17.5,mi:5.4,min:24,rest:"Pho Corner",zone:"Downtown"},
{id:4,app:"Spark (Walmart)",pay:28.2,mi:7.8,min:27,rest:"Walmart Supercenter",zone:"Eastside"}];
let S={rules:{payout:15,pm:2,hr:25,mi:8,min:30,mpg:28,gas:3.25},req:{payout:1,pm:0,hr:0,mi:1,min:0},blocked:[],pref:[],avoid:[],hist:[],offers:[],miles:[],nid:10,welcomed:0};
try{const x=localStorage.getItem("gigradar_v3");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("gigradar_v3",JSON.stringify(S))}catch(e){}};
const $=n=>"$"+n.toFixed(2),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has=(l,v)=>v&&l.some(x=>x.toLowerCase()===v.toLowerCase());
let tab=S.welcomed?"radar":"welcome",sel=null;
function ev(o){const r=S.rules,q=S.req,pm=o.pay/o.mi,hr=o.pay/o.min*60,fuel=o.mi/r.mpg*r.gas,C=[];
const add=(n,req,ok,t)=>C.push({n,req,ok,t});
add("Minimum payout",q.payout,o.pay>=r.payout,`${$(o.pay)} ${o.pay>=r.payout?"≥":"<"} ${$(r.payout)}`);
add("Minimum $/mile",q.pm,pm>=r.pm,`${$(pm)} ${pm>=r.pm?"≥":"<"} ${$(r.pm)}`);
add("Maximum miles",q.mi,o.mi<=r.mi,`${o.mi} ${o.mi<=r.mi?"≤":">"} ${r.mi} miles`);
add("Maximum time",q.min,o.min<=r.min,`${o.min} ${o.min<=r.min?"≤":">"} ${r.min} minutes`);
add("Minimum hourly",q.hr,hr>=r.hr,`${$(hr)} ${hr>=r.hr?"≥":"<"} ${$(r.hr)}/hr`);
if(has(S.blocked,o.rest))add("Blocked location",1,false,"This location is on your blocked list.");
else if(has(S.pref,o.rest))add("Preferred restaurant",0,true,"This location is on your preferred list.");
if(has(S.avoid,o.zone))add("Avoid zone",1,false,`${esc(o.zone)} is in your avoid zones.`);
else if(S.pref.length||0){}
if(has(S.zones||[],o.zone))add("Preferred zone",0,true,`${esc(o.zone)} is a preferred zone.`);
const bad=C.some(c=>!c.ok&&c.req),part=C.some(c=>!c.ok&&!c.req);
return{C,pm,hr,fuel,after:o.pay-fuel,st:bad?"bad":part?"part":"good",match:Math.round(C.filter(c=>c.ok).length/C.length*100),n:C.filter(c=>c.ok).length}}
const LBL={good:"MEETS YOUR RULES",part:"PARTIAL MATCH",bad:"DOESN'T MEET YOUR RULES"};
const go=t=>{tab=t;sel=null;draw();scrollTo(0,0)};
const card=(o,top)=>{const e=ev(o);return`<button class="card ${top?"top":""}" onclick="sel=${o.id};go2()"><div class="row"><b>${o.app}</b><span class="pill ${e.st}">${e.match}% · ${LBL[e.st]}</span></div><div class="m"><span><b>${$(o.pay)}</b><small>payout</small></span><span><b>${o.mi} mi</b><small>distance</small></span><span><b>${$(e.pm)}</b><small>$/mile</small></span><span><b>${$(e.hr)}</b><small>per hour</small></span></div></button>`};
const go2=()=>{tab="offer";draw();scrollTo(0,0)};
const V={
welcome:()=>`<div class="hero"><div style="font-size:48px">📡</div><h1>GigRadar</h1><h2 style="font-size:22px">Filter. Your. Income.</h2><p>Set your rules. Add your offers. See which ones meet your requirements.</p></div><button class="btn" onclick="S.welcomed=1;save();go('rules')">Get started</button><button class="btn alt" onclick="S.welcomed=1;save();go('radar')">Skip to radar</button>`,
radar:()=>{const L=S.offers.map(o=>({o,e:ev(o)})).sort((a,b)=>({good:0,part:1,bad:2}[a.e.st]-{good:0,part:1,bad:2}[b.e.st])||b.e.hr-a.e.hr),n=L.filter(x=>x.e.st=="good").length;
return`<p class="good">● Radar active</p><h1>${n} ${n==1?"opportunity meets":"opportunities meet"} your rules</h1><p>Your numbers. Your decision.</p>
${L.length?`<h2>Top match</h2>${card(L[0].o,1)}${L.length>1?"<h2>Other offers</h2>"+L.slice(1).map(x=>card(x.o)).join(""):""}`:`<div class="card" style="cursor:default"><b>No offers yet</b><p>Add an offer you're considering, or try a few samples.</p></div><button class="btn" onclick="go('add')">Add an offer</button><button class="btn alt" onclick="trySamples()">Try sample offers</button>`}`},
about:()=>`<button class="back" onclick="go('rules')">‹ Back</button><h1>About GigRadar</h1><p>GigRadar helps gig drivers decide faster. You set your own rules for pay, miles, time and places. GigRadar checks each offer against them and shows exactly why it passed or didn't. You always make the final call.</p>
<h2>How it works</h2><div class="chk"><i class="good">1</i><div><b>Set your rules</b><small>Choose which ones are required and which are preferences.</small></div></div><div class="chk"><i class="good">2</i><div><b>Add an offer</b><small>Enter the numbers your gig app shows you.</small></div></div><div class="chk"><i class="good">3</i><div><b>See the result and why</b><small>Meets, partial match or doesn't meet, with the reasons.</small></div></div>
<h2>Good to know</h2><p>You enter offers yourself. GigRadar doesn't connect to gig apps yet.</p><p>Fuel costs and earnings are estimates, not tax or financial advice.</p><p>GigRadar is not affiliated with or endorsed by any delivery or rideshare platform.</p><p>Your rules, offers and history stay on this device.</p>
<p class="good" style="margin-top:20px;font-weight:700">Filter. Your. Income.</p><p>Version 1.2 (test)</p><button class="btn alt" onclick="resetAll()">Reset all data</button>`,
miles:()=>{const E=entries(),now=Date.now(),D=864e5,t0=new Date().setHours(0,0,0,0),sum=f=>E.filter(f).reduce((a,x)=>a+x.mi,0),
tot=[["Today",sum(x=>x.ts>=t0)],["7 days",sum(x=>x.ts>=now-7*D)],["30 days",sum(x=>x.ts>=now-30*D)],["All time",sum(()=>true)]],
today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
return`<button class="back" onclick="go('history')">‹ Back</button><h1>Mileage log</h1><p>Miles from offers you accept are added automatically. Add any other trips by hand.</p>
<div class="card" style="cursor:default"><div class="m">${tot.map(t=>`<span><b>${t[1].toFixed(1)}</b><small>${t[0]}</small></span>`).join("")}</div></div>
<h2>Add a trip</h2><label>Miles</label><input id="m_mi" type="number" step="0.1" inputmode="decimal"><label>Date</label><input id="m_dt" type="date" value="${today}"><label>Note (optional)</label><input id="m_note"><p id="m_err" class="bad" style="margin-top:8px"></p><button class="btn" onclick="addMiles()">Add trip</button>
<h2>Entries</h2>${E.length?E.map(x=>`<div class="chk"><div style="flex:1"><b>${x.mi} mi</b> <small style="display:inline">${x.src}</small><small>${new Date(x.ts).toLocaleDateString()}${x.note?" · "+esc(x.note):""}</small></div>${x.id?`<button class="back" style="padding:0" onclick="delMiles(${x.id})">Delete</button>`:""}</div>`).join(""):`<p>No miles logged yet.</p>`}`},
map:()=>{const names=[...new Set([...S.zones,...S.avoid,...S.offers.map(o=>o.zone).filter(Boolean)])].slice(0,6),slots=[[6,8],[50,16],[8,38],[48,46],[10,66],[52,70]],zc=n=>has(S.avoid,n)?"avoid":has(S.zones,n)?"pref":"";
const ini=a=>({DoorDash:"DD","Uber Eats":"UE",Grubhub:"GH","Spark (Walmart)":"SP",Instacart:"IC",Roadie:"RO","Amazon Flex":"AF",Lyft:"LY"})[a]||a.slice(0,2).toUpperCase();
return`<h1>Your gig zones</h1><p>Preferred zones are green and avoid zones are red. Tap a pin to open the offer.</p>
<div class="map"><div class="road r1"></div><div class="road r2"></div>${names.map((n,i)=>`<div class="zone ${zc(n)}" style="left:${slots[i][0]}%;top:${slots[i][1]}%">${esc(n)}</div>`).join("")}
${(()=>{const cnt={};return S.offers.map(o=>{const e=ev(o),zi=names.indexOf(o.zone),z=zi>=0?slots[zi]:null,key=z?zi:"u",k=cnt[key]=(cnt[key]===undefined?0:cnt[key]+1),l=z?z[0]+2+(k%3)*13:6+(k%5)*17,t=z?z[1]+13+Math.floor(k/3)*11:78+Math.floor(k/5)*11;return`<button class="pin ${e.st}" style="left:${l}%;top:${t}%" onclick="sel=${o.id};go2()">$${Math.round(o.pay)}</button>`}).join("")})()}</div>
<p style="margin-top:10px">Pins show each offer's payout. Green pins meet your rules. ${names.length?"":"Add zones on the Rules tab to see them here."}</p>`},
add:()=>`<h1>Add an offer</h1><p>Enter what the gig app shows you.</p>
<label>Platform</label><select id="a_app">${["DoorDash","Uber Eats","Grubhub","Spark (Walmart)","Instacart","Roadie","Amazon Flex","Lyft","Other"].map(x=>`<option>${x}</option>`).join("")}</select>
<label>Payout ($)</label><input id="a_pay" type="number" step="0.25" inputmode="decimal">
<label>Total miles</label><input id="a_mi" type="number" step="0.1" inputmode="decimal">
<label>Estimated minutes</label><input id="a_min" type="number" inputmode="numeric">
<label>Restaurant / business</label><input id="a_rest">
<label>Zone or area</label><input id="a_zone"><p id="a_err" class="bad" style="margin-top:8px"></p>
<button class="btn" onclick="addOffer()">Evaluate offer</button>`,
offer:()=>{const o=S.offers.find(x=>x.id==sel);if(!o)return V.radar();const e=ev(o),ic={true:["✓","good"],false:null};
return`<button class="back" onclick="go('radar')">‹ Back</button><div class="card" style="cursor:default"><div class="row"><b>${o.app}</b><span class="pill ${e.st}">${e.match}% match</span></div><div class="big">${$(o.pay)}</div><p style="margin:0">${esc(o.rest||"Restaurant not listed")}${o.zone?" · "+esc(o.zone):""}</p>
<div class="m"><span><b>${o.mi} mi</b><small>distance</small></span><span><b>${o.min} min</b><small>time</small></span><span><b>${$(e.pm)}</b><small>$/mile</small></span><span><b>${$(e.hr)}</b><small>per hour</small></span></div></div>
<div class="card" style="cursor:default"><div class="row"><span>Estimated fuel</span><b>${$(e.fuel)}</b></div><div class="row"><span>After-fuel earnings</span><b class="good">${$(e.after)}</b></div></div>
<h2 class="${e.st}">${LBL[e.st]}</h2><p>${e.n} of ${e.C.length} checks met. Why this result:</p>
${e.C.map(c=>`<div class="chk"><i class="${c.ok?"good":c.req?"bad":"part"}">${c.ok?"✓":c.req?"✕":"⚠"}</i><div><b>${c.n}</b> <small style="display:inline">${c.ok?"Meets":c.req?"Required, not met":"Outside preference"}</small><small>${c.t}</small></div></div>`).join("")}
<div class="two"><button class="btn alt" onclick="decide('Passed')">Pass</button><button class="btn" onclick="decide('Accepted')">${e.st=="bad"?"Accept anyway":"Accept"}</button></div>`},
rules:()=>{const r=S.rules,R=(k,l,st,c)=>`<div class="rule"><span>${l}</span><input type="number" step="${st}" value="${r[k]}" onchange="S.rules.${k}=+this.value||0;save()">${c?`<label><input type="checkbox" ${S.req[k]?"checked":""} onchange="S.req.${k}=this.checked?1:0;save()">Required</label>`:"<span></span>"}</div>`,
L=(k,t,ph)=>`<h2>${t}</h2><div>${S[k].map((x,i)=>`<span class="chip">${esc(x)}<button onclick="S.${k}.splice(${i},1);save();draw()">×</button></span>`).join("")}</div><div class="two"><input id="l_${k}" placeholder="${ph}"><button class="btn alt" style="width:90px;margin:0" onclick="addL('${k}')">Add</button></div>`;
return`<h1>My gig rules</h1><p>Required rules must be met. Others are preferences that give a partial match.</p>
<h2>Earnings and trip</h2>${R("payout","Minimum payout ($)",.5,1)}${R("pm","Minimum $/mile",.25,1)}${R("hr","Minimum hourly ($)",1,1)}${R("mi","Maximum miles",.5,1)}${R("min","Maximum minutes",1,1)}
<h2>Vehicle</h2>${R("gas","Fuel price ($/gal)",.05,0)}${R("mpg","Vehicle MPG",1,0)}
${L("blocked","Blocked restaurants","Add a restaurant")}${L("pref","Preferred restaurants","Add a restaurant")}${L("zones","Preferred zones","Add a zone, e.g. Downtown")}${L("avoid","Avoid zones","Add a zone")}
<button class="btn" onclick="go('radar')">Save my rules</button><button class="btn alt" onclick="go('about')">About GigRadar</button>`},
history:()=>{const A=S.hist.filter(h=>h.st=="Accepted"),g=A.reduce((a,h)=>a+h.pay,0),f=A.reduce((a,h)=>a+h.fuel,0),mi=A.reduce((a,h)=>a+h.mi,0);
return`<h1>History and earnings</h1><button class="btn alt" style="margin:0 0 10px" onclick="go('miles')">Mileage log ›</button><div class="card" style="cursor:default"><p style="margin:0">Accepted offers (estimates)</p><div class="m"><span><b>${$(g)}</b><small>gross</small></span><span><b>-${$(f)}</b><small>fuel</small></span><span><b>${$(g-f)}</b><small>after fuel</small></span><span><b>${mi.toFixed(1)}</b><small>miles</small></span></div></div>
<h2>Decisions</h2>${S.hist.length?S.hist.map(h=>`<div class="chk"><div style="flex:1"><b>${h.app}</b> ${$(h.pay)}<small>${h.mi} mi · ${h.date}</small></div><b class="${h.st=="Accepted"?"good":"part"}">${h.st}</b></div>`).join(""):`<p>No decisions yet. Accept or pass an offer from the radar.</p>`}`}};
function trySamples(){S.offers=JSON.parse(JSON.stringify(SAMPLE));save();draw()}
function resetAll(){if(!confirm("Erase all your rules, offers and history on this device?"))return;try{localStorage.removeItem("gigradar_v3")}catch(e){}location.reload()}
function entries(){return[...S.hist.filter(h=>h.st=="Accepted").map(h=>({mi:h.mi,ts:h.ts||Date.parse(h.date)||0,src:"Accepted offer",note:""})),...S.miles.map(m=>({id:m.id,mi:m.mi,ts:m.ts,src:"Manual",note:m.note}))].sort((a,b)=>b.ts-a.ts)}
function addMiles(){const mi=+document.getElementById("m_mi").value,d=document.getElementById("m_dt").value,note=document.getElementById("m_note").value.trim();
if(!(mi>0)||!d){document.getElementById("m_err").textContent="Enter the miles and a date.";return}
const q=d.split("-").map(Number);S.miles.push({id:S.nid++,mi,ts:new Date(q[0],q[1]-1,q[2],12).getTime(),note});save();draw()}
function delMiles(id){S.miles=S.miles.filter(m=>m.id!=id);save();draw()}
function addL(k){const el=document.getElementById("l_"+k),v=el.value.trim();if(v){S[k].push(v);save();draw()}}
function addOffer(){const g=i=>document.getElementById("a_"+i).value,pay=+g("pay"),mi=+g("mi"),min=+g("min");
if(!(pay>0&&mi>0&&min>0)){document.getElementById("a_err").textContent="Enter payout, miles and minutes as numbers above zero.";return}
const o={id:S.nid++,app:g("app"),pay,mi,min,rest:g("rest").trim(),zone:g("zone").trim()};S.offers.unshift(o);save();sel=o.id;go2()}
function decide(st){const o=S.offers.find(x=>x.id==sel),e=ev(o);S.hist.unshift({app:o.app,pay:o.pay,mi:o.mi,fuel:e.fuel,st,ts:Date.now(),date:new Date().toLocaleDateString()});S.offers=S.offers.filter(x=>x.id!=sel);save();go("history")}
function draw(){const a=document.getElementById("app");a.innerHTML=V[tab]()+(tab=="welcome"?"":`<nav>${[["radar","Radar"],["map","Map"],["add","Add offer"],["rules","Rules"],["history","History"]].map(t=>`<button class="${tab==t[0]||(tab=="offer"&&t[0]=="radar")||(tab=="miles"&&t[0]=="history")?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</nav>`)}
S.zones=S.zones||[];draw();
if(S.welcomed&&!document.getElementById("splash")){const d=document.createElement("div");d.id="splash";d.innerHTML='<div style="font-size:54px">📡</div><h1>GigRadar</h1><p>Filter. Your. Income.</p>';document.body.appendChild(d);setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),400)},1300)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script></body></html>
